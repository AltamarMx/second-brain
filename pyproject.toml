[project]
name = "second-brain"
version = "0.1.0"
description = "Biblioteca personal de artículos científicos consultable con LLMs"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pymupdf4llm>=0.3.4,<1",
    "rapidfuzz>=3.14.6",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.2",
]

[project.scripts]
sb = "second_brain.cli:app"
sb-mcp = "second_brain.mcp_server:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long user-facing messages; ruff format handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type swig:DeprecationWarning"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
